<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASAP Release Note</title>
<style>
  :root{--brand:#2563eb;--bg:#f3f5f9;--card:#fff;--line:#e4e7ee;--text:#1f2937;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--radius:10px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--brand);text-decoration:none}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  .brand .dot{width:12px;height:12px;background:var(--brand);border-radius:50%}
  .spacer{flex:1}
  .user-name{color:var(--brand);background:#eef2ff;border-radius:8px;padding:6px 14px;font-size:14px}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .searchbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .searchbar input{flex:1;max-width:420px;padding:9px 14px;font-size:14px;border:1px solid var(--line);border-radius:9px;outline:none}
  .searchbar input:focus{border-color:var(--brand)}
  .srch-hint{font-size:13px;color:var(--muted);white-space:nowrap}
  .search-results{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .search-results h4{margin:0 0 12px;font-size:15px}
  .sr-item{display:flex;gap:14px;padding:10px 6px;border-bottom:1px dashed var(--line);align-items:flex-start}
  .sr-item:last-child{border-bottom:none}
  .sr-desc{flex:1}
  .sr-desc .t{font-size:13px;color:var(--text)}
  .sr-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--muted)}
  .sr-meta b{color:#374151;font-weight:600}
  .sr-tag{font-size:11px;border-radius:999px;padding:1px 9px;background:#eef2ff;color:#2563eb;white-space:nowrap}
  .tabs{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:4px;background:#eef1f7;border-radius:12px;width:100%}
  .tab{padding:10px 30px;border-radius:9px;cursor:pointer;font-weight:600;font-size:16px;border:1px solid transparent;color:#7a828e;user-select:none}
  .tab.tab-blue.selected{background:#2563eb;color:#fff}
  .tab.tab-yellow.selected{background:#f59e0b;color:#5b3a00}

  /* 月历（仿内网形式） */
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:16px;max-width:360px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cal-head button{border:none;background:#eef2ff;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px;color:var(--brand)}
  .cal-title{font-size:14px;font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
  .cal-cell{height:26px;line-height:26px;text-align:center;border-radius:6px;cursor:default;color:#374151;font-size:12px;position:relative;user-select:none}
  .cal-cell.blank{cursor:default;color:transparent}
  .cal-cell.has{background:#eef2ff;color:var(--brand);cursor:pointer;font-weight:700}
  .cal-cell.has::after{content:"";position:absolute;left:50%;top:2px;width:5px;height:5px;margin-left:-2.5px;background:var(--brand);border-radius:50%}
  .cal-cell.sel{background:var(--brand);color:#fff}
  .cal-cell.sel::after{background:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .meta-field label{display:block;font-size:14px;color:var(--text);margin-bottom:4px;font-weight:600}
  .meta-field .val{font-size:15px;color:#374151;padding:4px 0}
  .section-head{display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .week-date{font-size:17px;color:var(--brand);margin:0 0 14px;border-bottom:2px solid var(--line);padding-bottom:6px}
  .section-head h3{margin:0;font-size:16px}
  .badge{background:#eef2ff;color:var(--brand);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  .item{font-size:15px;line-height:1.7;padding:10px 2px;border-bottom:1px dashed var(--line);white-space:pre-wrap;word-break:break-word}
  .item:last-child{border-bottom:none}
  .empty-note{color:var(--muted);font-size:13px;padding:8px 2px}
  .gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .gate input{padding:10px 14px;font-size:15px;border:1px solid var(--line);border-radius:8px;width:240px}
  .gate button{border:none;border-radius:8px;padding:10px 22px;font-size:15px;background:var(--brand);color:#fff;cursor:pointer}
  .gate .err{color:var(--red);font-size:13px;min-height:18px}
  .footer{color:var(--muted);font-size:22px;text-align:center;padding:20px}
  .note-bold{font-weight:600}
  .layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .col-cal{flex:0 0 360px;max-width:100%}
  .col-detail{flex:1;min-width:320px}
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate" class="gate">
  <div class="brand"><span class="dot"></span> PASAP Release Note</div>
  <div>
    <input type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')doUnlock()">
  </div>
  <button onclick="doUnlock()">Unlock</button>
  <div id="pwErr" class="err"></div>
</div>

<!-- 主内容（默认隐藏，验证后显示） -->
<div id="main" style="display:none">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="dot"></span> PASAP Release Note</div>
      <div class="spacer"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="searchbar">
      <input id="searchInput" type="text" placeholder="Input search JIRA ticket or Content" oninput="onSearch()">
      <span class="srch-hint" id="srchHint"></span>
    </div>

    <div id="searchResults" class="search-results" style="display:none"></div>

    <div class="tabs">
      <div class="tab tab-blue selected" data-v="14inch" onclick="setVersion('14inch')">14inch</div>
      <div class="tab tab-yellow" data-v="12inch" onclick="setVersion('12inch')">12inch</div>
    </div>

    <div class="layout">
      <div class="col-cal" id="calColumn"></div>
      <div class="col-detail" id="detailColumn"></div>
    </div>

    <div class="footer"><span class="note-bold">สำหรับ PASAP เท่านั้น, โปรดอย่าส่งต่อ</span></div>
  </div>
</div>

<script>
  // 由发布脚本注入：对外数据 + 访问密码
  window.EXT_DATA = {"generated": "2026-08-06 19:04:33", "weeks": [{"version": "14inch", "date": "2026-08-13", "soc": "14.100000", "mcu_large": "45.59", "mcu_small": "45.42", "mcu": "", "amigo": "PG80220801 DATA80220080", "amigo_p1p6": "", "amigo_p7": "", "upgrade": "kwi", "sections": {"specChange": [{"desc": "[TDEM25-1156][TDEM25-1203][25TMA][Battery12v] Change HMI design based on customer meeting 30Jul26"}, {"desc": "[TDEM25-1204][25TMA][HMI]Extend lock icon"}, {"desc": "[TDEM25-1149]String ID_20260805"}], "iAutoBug": [], "jiraBug": [{"desc": "[TMAB25-375][25TMA][Random][Carplay] Wireless CarPlay does not auto-reconnect after the phone is taken out of the HU range and then Wi-Fi is reconnected on the phone"}, {"desc": "[TMAB25-393][25TMA][12.9inch][Flow][WebLink] WebLink music screen does not displayed when transit from Music Widget (while WebLink music source OFF)_Update spec"}, {"desc": "[TMAB25-400][25TMA][Weblink] Split screen flickers when Dial Failed on Weblink"}, {"desc": "[STT-310]Voltage issue_JBL AMP error pop up"}, {"desc": "[TDEM25-1061][25TMA] Can't switch to WAA and WCP (TKM Activity)"}], "others": [{"desc": "VR SDK"}, {"desc": "Implement HW App Note(PARTS-28_Battery_Monitor_ver0.22)"}]}}, {"version": "12inch", "date": "2026-08-06", "soc": "12.021000", "mcu_large": "", "mcu_small": "", "mcu": "12.27", "amigo": "", "amigo_p1p6": "PG80220801 DATA80220080", "amigo_p7": "PG8F230301 DATA8F230030", "upgrade": "kwi", "sections": {"specChange": [{"desc": "[AM12-69]2S_DAB_Addition read BER value in test mode_decimal valve"}], "iAutoBug": [], "jiraBug": [{"desc": "[TMAB25-395][25TMA][12.9inch][Operation][DAB] Not cancel Favrite checkbox state when BT call interrupt"}, {"desc": "[TMAB25-375][25TMA][Random][Carplay] Wireless CarPlay does not auto-reconnect after the phone is taken out of the HU range and then Wi-Fi is reconnected on the phone"}, {"desc": "[TMAB25-393][25TMA][12.9inch][Flow][WebLink] WebLink music screen does not displayed when transit from Music Widget (while WebLink music source OFF)_Update spec"}, {"desc": "[TMAB25-400][25TMA][Weblink] Split screen flickers when Dial Failed on Weblink"}, {"desc": "[TDEM25-1061][25TMA] Can't switch to WAA and WCP (TKM Activity)"}], "others": []}}, {"version": "12inch", "date": "2026-08-13", "soc": "12.021100", "mcu_large": "", "mcu_small": "", "mcu": "12.27", "amigo": "", "amigo_p1p6": "PG80220801   DATA80220080", "amigo_p7": "PG8F230301   DATA8F230030", "upgrade": "kwi", "sections": {"specChange": [{"desc": "[TDEM25-1204][25TMA][HMI]Extend lock icon"}, {"desc": "[TDEM25-1156][TDEM25-1203][25TMA][Battery12v] Change HMI design based on customer meeting 30Jul26"}, {"desc": "[TDEM25-1149]String ID_20260805"}], "iAutoBug": [], "jiraBug": [{"desc": "[DDAB-150] Ensemble Name and Service Name Are Not Displayed on Now Playing Screen When Selecting a Favorite Service with RF OFF"}], "others": [{"desc": "Implement HW App Note(PARTS-28_Battery_Monitor_ver0.22)"}, {"desc": "WebLink Official Client SDK 3.5.0.13979"}]}}, {"version": "12inch", "date": "2026-08-20", "soc": "12.021200", "mcu_large": "", "mcu_small": "", "mcu": "12.27", "amigo": "", "amigo_p1p6": "PG80220801   DATA80220080", "amigo_p7": "PG8F230301   DATA8F230030", "upgrade": "kwi", "sections": {"specChange": [{"desc": "[TDEM25-1186][25TMA 12.9inch] Fix angle when 3D Door Open"}], "iAutoBug": [], "jiraBug": [], "others": []}}]};
  // 由发布脚本注入：对外数据 + 访问密码
  window.EXT_PASS = "kengteesud";

  var cur = { version: "14inch" };
  var _cal = null;   // 月历当前 {y,m}
  var _selDate = null; // 当前选中的日期 (YYYY-MM-DD)

  var EN_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var EN_DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var SECTION_LABELS = [
    {key:"specChange", label:"Spec Change"},
    {key:"iAutoBug", label:"iAuto Internal Bug Fix"},
    {key:"jiraBug", label:"JIRA Bug Fix"},
    {key:"others", label:"Others"}
  ];

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
  }

  // 该版本所有周（已排序）
  function versionWeeks(){
    var arr = (EXT_DATA && EXT_DATA.weeks) ? EXT_DATA.weeks : [];
    return arr.filter(function(w){ return w.version === cur.version; })
              .sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
  }
  function curVersion(){ return cur.version; }

  // 已解锁状态 key（页面加载时若在则自动进入，免重复输密码）
  var _unlockedKey = "pasap_unlocked_fhnv";

  // 密码校验
  function doUnlock(){
    var v = $("pw").value;
    if(EXT_PASS && v === EXT_PASS){
      try{ localStorage.setItem(_unlockedKey, "1"); }catch(e){}
      showMain();
    }
    else { $("pwErr").textContent = "Wrong password"; $("pw").value=""; }
  }
  // 进入主界面（首次输密码后调用）
  function showMain(){
    $("gate").style.display="none";
    $("main").style.display="block";
    initView();
    startUpdateWatcher();
  }

  // 简易内容哈希（基于对外 weeks 数据）
  function extHash(obj){
    var s = JSON.stringify((obj && obj.weeks) || []);
    var h = 0, i;
    for(i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
    return ""+h;
  }
  // 定期检测：有新同步就自动刷新整页（每 30 秒）；重载后免密码（已有解锁标记）
  function startUpdateWatcher(){
    var baseHash = extHash(EXT_DATA);
    setInterval(function(){
      fetch("data.json", {cache:"no-store"}).then(function(r){ return r.json(); })
        .then(function(d){
          if(extHash(d) !== baseHash){
            location.reload();
          }
        })
        .catch(function(){ /* 网络/解析失败则忽略 */ });
    }, 30000);
  }
  // 页面加载：如果已经解锁过（浏览器本地记录），直接进主界面
  (function autoUnlockOnLoad(){
    var unlock = false;
    try{ unlock = localStorage.getItem(_unlockedKey) === "1"; }catch(e){}
    if(unlock){
      try{ $("main").style.display = "block"; $("gate").style.display = "none"; }catch(e){}
      // 需等 DOM 就绪后 init
      if(document.readyState === "complete" || document.readyState === "interactive"){
        initView(); startUpdateWatcher();
      }else{
        document.addEventListener("DOMContentLoaded", function(){ initView(); startUpdateWatcher(); });
      }
    }
  })();

  function initView(){
    var weeks = versionWeeks();
    // 默认选中最近一个日期
    if(weeks.length){ _selDate = weeks[weeks.length-1].date; }
    else { _selDate = null; }
    // 初始月 = 选中日期所在月
    if(_selDate){ var d = new Date(_selDate+"T00:00:00"); _cal = {y:d.getFullYear(), m:d.getMonth()}; }
    else { var t=new Date(); _cal={y:t.getFullYear(), m:t.getMonth()}; }
    renderTabs();
    renderCalendar();
    renderDetail();
  }

  function renderTabs(){
    document.querySelectorAll(".tab").forEach(function(t){
      t.classList.toggle("selected", t.getAttribute("data-v") === cur.version);
    });
  }
  function setVersion(v){
    cur.version = v;
    initView();
  }

  // 当前版本某日是否有周
  function weekByDate(ds){
    var weeks = versionWeeks();
    for(var i=0;i<weeks.length;i++) if(weeks[i].date === ds) return weeks[i];
    return null;
  }

  function renderCalendar(){
    var col = $("calColumn");
    var y=_cal.y, m=_cal.m;
    var head = '<div class="cal-head">'
      + '<button onclick="calMonth(-1)">◀</button>'
      + '<span class="cal-title">'+EN_MONTHS[m]+' '+y+'</span>'
      + '<button onclick="calMonth(1)">▶</button></div>';
    var grid = '<div class="cal-grid">';
    EN_DOWS.forEach(function(d){ grid += '<div class="cal-dow">'+d+'</div>'; });
    var firstDow = new Date(y,m,1).getDay();
    var days = new Date(y,m+1,0).getDate();
    for(var i=0;i<firstDow;i++) grid += '<div class="cal-cell blank"></div>';
    for(var d=1;d<=days;d++){
      var ds = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      var wk = weekByDate(ds);
      var cls = "cal-cell";
      if(wk) cls += " has";
      if(ds === _selDate) cls += " sel";
      if(wk){
        grid += '<div class="'+cls+'" onclick="pickDate(\''+ds+'\')">'+d+'</div>';
      } else {
        grid += '<div class="'+cls+'">'+d+'</div>';
      }
    }
    grid += '</div>';
    $("calColumn").innerHTML = head + grid;
  }
  function shiftMonth(delta){
    _cal.m += delta;
    if(_cal.m<0){ _cal.m=11; _cal.y--; }
    if(_cal.m>11){ _cal.m=0; _cal.y++; }
    renderCalendar();
  }
  function pickDate(ds){
    _selDate = ds;
    renderCalendar();
    renderDetail();
  }

  function renderDetail(){
    var box = $("detailColumn");
    if(!_selDate){
      box.innerHTML = '<div class="card"><div class="empty-note">No release note selected. Click a date in the calendar.</div></div>';
      return;
    }
    var w = weekByDate(_selDate);
    if(!w){
      box.innerHTML = '<div class="card"><div class="empty-note">No release note for this date.</div></div>';
      return;
    }
    var spec = (cur.version==="14inch") ? ["date","soc","mcu_large","mcu_small","amigo","upgrade"] : ["date","soc","mcu","amigo_p1p6","amigo_p7","upgrade"];
    var html = '<h3 class="week-date">'+esc(w.date||"—")+'</h3>';
    html += '<div class="card"><div class="meta-grid">';
    spec.forEach(function(k){
      var v = w[k] || "";
      // Amigo 与其余字段一致：保留换行，显示为多行（和内网一致）
      var valHtml = esc(v).replace(/\n/g, "<br>");
      html += '<div class="meta-field"><label>'+esc(labels0(k))+'</label><div class="val">'+valHtml+'</div></div>';
    });
    html += '</div></div>';
    SECTION_LABELS.forEach(function(sec){
      var arr = (w.sections||{})[sec.key] || [];
      html += '<div class="card"><div class="section-head"><h3>'+esc(sec.label)+'</h3><span class="badge">'+arr.length+' items</span></div>';
      if(!arr.length){ html += '<div class="empty-note">No items.</div>'; }
      else {
        arr.forEach(function(it,i){
          var desc = (it && it.desc) || "";
          html += '<div class="item">'+(i+1)+'. '+esc(desc)+'</div>';
        });
      }
      html += '</div>';
    });
    box.innerHTML = html;
  }
  function labels0(k){
    return {date:"Date",soc:"SOC Ver.","mcu_large":"Main MCU","mcu_small":"Sub MCU",mcu:"MCU Ver.",amigo:"Amigo Ver.",amigo_p1p6:"Amigo(P1~P6)",amigo_p7:"Amigo(P7)",upgrade:"Upgrade"}[k] || k;
  }

  // 本地搜索（跨所有版本/周，搜 desc），结果含版本号与日期
  function onSearch(){
    var kw = ($("searchInput").value||"").trim().toLowerCase();
    var hint = $("srchHint");
    var res = $("searchResults");
    if(!kw){
      res.style.display = "none"; res.innerHTML = ""; hint.textContent = "";
      return;
    }
    var arr = (EXT_DATA && EXT_DATA.weeks) ? EXT_DATA.weeks : [];
    var found = [];
    arr.forEach(function(w){
      SECTION_LABELS.forEach(function(sec){
        (((w.sections||{})[sec.key])||[]).forEach(function(it){
          if((it.desc||"").toLowerCase().indexOf(kw) >= 0){
            // 收集：版本号/日期/Amigo/SOC/MCU（结构对齐内网搜索结果的 sr-tag + sr-meta)
            var mcu = "";
            if(w.version === "14inch"){ var a=[w.mcu_large,w.mcu_small].filter(Boolean).join(" / "); mcu = a || ""; }
            else { mcu = w.mcu || ""; }
            var amigo = (w.version === "12inch") ? [w.amigo_p1p6,w.amigo_p7].filter(Boolean).join(" / ") : (w.amigo||"");
            found.push({ver:(w.version||""), date:(w.date||""), amigo:amigo,
                        upgrade:(w.upgrade||""), soc:(w.soc||""), mcu:mcu, sec:sec.label, text:it.desc});
          }
        });
      });
    });
    hint.textContent = "Found " + found.length + " result(s)";
    res.style.display = "block";
    var html = '<h4>Search results (' + found.length + ' items)</h4>';
    if(!found.length){ html += '<div class="empty-note">No matching content.</div>'; }
    else {
      found.forEach(function(r){
        html += '<div class="sr-item"><span class="sr-tag">'+esc(r.ver)+'</span>'
              + '<div class="sr-desc"><div class="t">'+esc(r.text)+'</div>'
              + '<div class="sr-meta"><span>Date <b>'+esc(r.date||"—")+'</b></span>'
              + '<span>｜ Amigo <b>'+esc(r.amigo||"—")+'</b></span>'
              + '<span>｜ Upgrade <b>'+esc(r.upgrade||"—")+'</b></span>'
              + '<span>｜ SOC <b>'+esc(r.soc||"—")+'</b></span>'
              + '<span>｜ MCU <b>'+esc(r.mcu||"—")+'</b></span>'
              + '<span>｜ '+esc(r.sec)+'</span></div>'
              + '</div></div>';
      });
    }
    res.innerHTML = html;
  }
</script>
</body>
</html>
