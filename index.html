<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASAP Release Note</title>
<style>
  :root{--brand:#2563eb;--bg:#f3f5f9;--card:#fff;--line:#e4e7ee;--text:#1f2937;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--radius:10px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--brand);text-decoration:none}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  .brand .dot{width:12px;height:12px;background:var(--brand);border-radius:50%}
  .spacer{flex:1}
  .user-name{color:var(--brand);background:#eef2ff;border-radius:8px;padding:6px 14px;font-size:14px}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .searchbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .searchbar input{flex:1;max-width:420px;padding:9px 14px;font-size:14px;border:1px solid var(--line);border-radius:9px;outline:none}
  .searchbar input:focus{border-color:var(--brand)}
  .srch-hint{font-size:13px;color:var(--muted)}
  .search-results{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .search-results h4{margin:0 0 12px;font-size:15px}
  .sr-item{display:flex;gap:14px;padding:10px 6px;border-bottom:1px dashed var(--line)}
  .sr-item:last-child{border-bottom:none}
  .sr-desc{flex:1}
  .sr-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--muted)}
  .tabs{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:4px;background:#eef1f7;border-radius:12px;width:100%}
  .tab{padding:10px 30px;border-radius:9px;cursor:pointer;font-weight:600;font-size:16px;border:1px solid transparent;color:#7a828e;user-select:none}
  .tab.tab-blue.selected{background:#2563eb;color:#fff}
  .tab.tab-yellow.selected{background:#f59e0b;color:#5b3a00}
  .weekbar h2{font-size:18px;margin:0 0 8px}
  .weekbar .hint{font-weight:400;font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .meta-field label{display:block;font-size:14px;color:var(--text);margin-bottom:4px;font-weight:600}
  .meta-field .val{font-size:15px;color:#374151;padding:4px 0}
  .section-head{display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .section-head h3{margin:0;font-size:16px}
  .badge{background:#eef2ff;color:var(--brand);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  .item{font-size:15px;line-height:1.7;padding:10px 2px;border-bottom:1px dashed var(--line);white-space:pre-wrap;word-break:break-word}
  .item:last-child{border-bottom:none}
  .empty-note{color:var(--muted);font-size:13px;padding:8px 2px}
  .gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .gate input{padding:10px 14px;font-size:15px;border:1px solid var(--line);border-radius:8px;width:240px}
  .gate button{border:none;border-radius:8px;padding:10px 22px;font-size:15px;background:var(--brand);color:#fff;cursor:pointer}
  .gate .err{color:var(--red);font-size:13px;min-height:18px}
  .footer{color:var(--muted);font-size:22px;text-align:center;padding:20px}
  .note-bold{font-weight:600}
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate" class="gate">
  <div class="brand"><span class="dot"></span> PASAP Release Note</div>
  <div>
    <input type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')doUnlock()">
  </div>
  <button onclick="doUnlock()">Unlock</button>
  <div id="pwErr" class="err"></div>
</div>

<!-- 主内容（默认隐藏，验证后显示） -->
<div id="main" style="display:none">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="dot"></span> PASAP Release Note</div>
      <div class="spacer"></div>
      <span class="user-name">PASAP</span>
    </div>
  </div>

  <div class="wrap">
    <div class="searchbar">
      <input id="searchInput" type="text" placeholder="Input JIRA ticket or Content" oninput="onSearch()">
      <span class="srch-hint" id="srchHint"></span>
    </div>

    <div class="tabs">
      <div class="tab tab-blue selected" data-v="14inch" onclick="setVersion('14inch')">14inch</div>
      <div class="tab tab-yellow" data-v="12inch" onclick="setVersion('12inch')">12inch</div>
    </div>

    <div class="weekday"><h2>Release Note <span class="hint" id="weekHint"></span></h2></div>

    <div id="searchResults" class="search-results" style="display:none"></div>
    <div id="content"></div>

    <div class="footer"><span class="note-bold">สำหรับ PASAP เท่านั้น, โปรดอย่าส่งต่อ</span></div>
  </div>
</div>

<script>
  // 由发布脚本注入：对外数据 + 访问密码
  window.EXT_DATA = {"generated": "2026-08-06 14:44:57", "weeks": [{"version": "14inch", "date": "2026-08-13", "soc": "14.100000", "mcu_large": "45.59", "mcu_small": "45.42", "mcu": "", "amigo": "PG80220801 DATA80220080", "sections": {"specChange": [{"desc": "[TDEM25-1156][TDEM25-1203][25TMA][Battery12v] Change HMI design based on customer meeting 30Jul26"}, {"desc": "[TDEM25-1204][25TMA][HMI]Extend lock icon"}, {"desc": "[TDEM25-1149]String ID_20260805"}], "iAutoBug": [], "jiraBug": [{"desc": "[TMAB25-375][25TMA][Random][Carplay] Wireless CarPlay does not auto-reconnect after the phone is taken out of the HU range and then Wi-Fi is reconnected on the phone"}, {"desc": "[TMAB25-393][25TMA][12.9inch][Flow][WebLink] WebLink music screen does not displayed when transit from Music Widget (while WebLink music source OFF)_Update spec"}, {"desc": "[TMAB25-400][25TMA][Weblink] Split screen flickers when Dial Failed on Weblink"}, {"desc": "[STT-310]Voltage issue_JBL AMP error pop up"}, {"desc": "[TDEM25-1061][25TMA] Can't switch to WAA and WCP (TKM Activity)"}], "others": [{"desc": "VR SDK"}]}}, {"version": "12inch", "date": "2026-08-06", "soc": "12.021000", "mcu_large": "", "mcu_small": "", "mcu": "12.27", "amigo": "P1~P6:PG80220801 DATA80220080\nP7: PG8F230301 DATA8F230030", "sections": {"specChange": [{"desc": "[AM12-69]2S_DAB_Addition read BER value in test mode_decimal valve"}], "iAutoBug": [], "jiraBug": [{"desc": "[TMAB25-395][25TMA][12.9inch][Operation][DAB] Not cancel Favrite checkbox state when BT call interrupt"}, {"desc": "[TMAB25-375][25TMA][Random][Carplay] Wireless CarPlay does not auto-reconnect after the phone is taken out of the HU range and then Wi-Fi is reconnected on the phone"}, {"desc": "[TMAB25-375][25TMA][Random][Carplay] Wireless CarPlay does not auto-reconnect after the phone is taken out of the HU range and then Wi-Fi is reconnected on the phone"}, {"desc": "[TMAB25-400][25TMA][Weblink] Split screen flickers when Dial Failed on Weblink"}, {"desc": "[TDEM25-1061][25TMA] Can't switch to WAA and WCP (TKM Activity)"}], "others": []}}, {"version": "12inch", "date": "2026-08-13", "soc": "12.021100", "mcu_large": "", "mcu_small": "", "mcu": "12.27", "amigo": "P1~P6:PG80220801 DATA80220080\nP7: PG8F230301 DATA8F230030", "sections": {"specChange": [{"desc": "[TDEM25-1204][25TMA][HMI]Extend lock icon"}, {"desc": "[TDEM25-1156][TDEM25-1203][25TMA][Battery12v] Change HMI design based on customer meeting 30Jul26"}, {"desc": "[TDEM25-1149]String ID_20260805"}], "iAutoBug": [], "jiraBug": [{"desc": "[DDAB-150] Ensemble Name and Service Name Are Not Displayed on Now Playing Screen When Selecting a Favorite Service with RF OFF"}], "others": []}}]};
  // 由发布脚本注入：对外数据 + 访问密码
  window.EXT_PASS = "PASAP123";

  var cur = { version: "14inch" };
  var locked_ = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
  }

  // 密码校验
  function doUnlock(){
    var v = $("pw").value;
    if(EXT_PASS && v === EXT_PASS){ $("gate").style.display="none"; $("main").style.display="block"; renderAll(); }
    else { $("pwErr").textContent = "Wrong password"; $("pw").value=""; }
  }

  // 数据：外部 weeks（只含 desc 等对外字段）
  var VERSION_LABELS = {
    "14inch": { name:"14inch", metas:["date","soc","mcu_large","mcu_small","amigo"], metaLabels:{date:"Date",soc:"SOC Ver.","mcu_large":"Main MCU","mcu_small":"Sub MCU",amigo:"Amigo Ver."} },
    "12inch": { name:"12inch", metas:["date","soc","mcu","amigo"], metaLabels:{date:"Date",soc:"SOC Ver.",mcu:"MCU Ver.",amigo:"Amigo Ver."} }
  };
  var SECTION_LABELS = [
    {key:"specChange", label:"Spec Change"},
    {key:"iAutoBug", label:"iAuto Internal Bug Fix"},
    {key:"jiraBug", label:"JIRA Bug Fix"},
    {key:"others", label:"Others"}
  ];

  function versionWeek(){
    var arr = (EXT_DATA && EXT_DATA.weeks) ? EXT_DATA.weeks : [];
    for(var i=0;i<arr.length;i++) if(arr[i].version === cur.version) return arr[i];
    return null;
  }

  function renderAll(){ renderTabs(); renderSections(); renderHint(); }

  function renderTabs(){
    document.querySelectorAll(".tab").forEach(function(t){
      t.classList.toggle("selected", t.getAttribute("data-v") === cur.version);
    });
  }
  function setVersion(v){
    cur.version = v;
    renderAll();
  }

  function renderHint(){
    var w = versionWeek();
    $("weekHint").textContent = w && w.date ? ("Date: " + w.date) : "";
  }

  function renderSections(){
    var box = $("content");
    var w = versionWeek();
    var html = "";
    if(!w){
      box.innerHTML = '<div class="card"><div class="empty-note">No data.</div></div>';
      return;
    }
    // 元数据卡
    var spec = (cur.version==="14inch") ? ["date","soc","mcu_large","mcu_small","amigo"] : ["date","soc","mcu","amigo"];
    var labels = {date:"Date",soc:"SOC Ver.","mcu_large":"Main MCU","mcu_small":"Sub MCU",mcu:"MCU Ver.",amigo:"Amigo Ver."};
    html += '<div class="card"><div class="meta-grid">';
    spec.forEach(function(k){
      var v = w[k] || "";
      html += '<div class="meta-field"><label>'+esc(labels[k])+'</label><div class="val">'+esc(v).replace(/\n/g,"<br>")+'</div></div>';
    });
    html += '</div></div>';
    // 各段
    SECTION_LABELS.forEach(function(sec){
      var arr = (w.sections||{})[sec.key] || [];
      html += '<div class="card"><div class="section-head"><h3>'+esc(sec.label)+'</h3><span class="badge">'+arr.length+' items</span></div>';
      if(!arr.length){ html += '<div class="empty-note">No items.</div>'; }
      else {
        arr.forEach(function(it, i){
          var desc = (it && it.desc) || "";
          html += '<div class="item">'+(i+1)+'. '+esc(desc)+'</div>';
        });
      }
      html += '</div>';
    });
    box.innerHTML = html;
  }

  // 本地搜索（当前版本内，搜 desc）
  function onSearch(){
    var kw = ($("searchInput").value||"").trim().toLowerCase();
    var hint = $("srchHint");
    var res = $("searchResults");
    if(!kw){
      res.style.display = "none"; res.innerHTML = "";
      hint.textContent = "";
      return;
    }
    var w = versionWeek();
    var found = [];
    if(w){
      SECTION_LABELS.forEach(function(sec){
        (w.sections||{})[sec.key] = (w.sections||{})[sec.key]||[];
        (w.sections||{})[sec.key].forEach(function(it){
          if((it.desc||"").toLowerCase().indexOf(kw) >= 0){
            found.push({sec:sec.label, text:it.desc});
          }
        });
      });
    }
    hint.textContent = "Found " + found.length + " result(s)";
    res.style.display = "block";
    var html = '<h4>Search results (' + found.length + ' items)</h4>';
    if(!found.length){ html += '<div class="empty-note">No matching content.</div>'; }
    else {
      found.forEach(function(r){
        html += '<div class="sr-item"><div class="sr-desc"><div>'+esc(r.text)+'</div>'
              + '<div class="sr-meta"><span>'+esc(r.sec)+'</span></div></div></div>';
      });
    }
    res.innerHTML = html;
  }
</script>
</body>
</html>
